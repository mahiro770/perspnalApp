name = "kurashi-log-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "kurashi-log-db"
# `wrangler d1 create kurashi-log-db` の出力で置き換える
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"
migrations_dir = "drizzle"

[vars]
# フロントエンド(Cloudflare Pages)のオリジン。CORS許可用。ローカル開発用の値を初期値としている
ALLOWED_ORIGIN = "http://localhost:5173"

# VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT は機密情報のためここには書かず、
# `wrangler secret put VAPID_PUBLIC_KEY` 等で個別に設定する(README参照)

[triggers]
# 天気更新(30分おき)と、通知(毎日 UTC 22:00 = JST 7:00)。scheduled()内でevent.cronにより分岐する
crons = ["*/30 * * * *", "0 22 * * *"]
